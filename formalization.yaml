fidelity:
  divergences: >-
    The informal Theorem I allows C^{3,1} boundaries, C^{2,1} leading coefficients, bounded lower
    order coefficients, weak solutions in C^1 up to the boundary, and in part (b) constant
    coefficient operators with the conormal derivative. The formal statements assume: (1) after a
    rigid motion, the boundary point is the origin and the domain is the part of the ball B(0, rho)
    above the graph of a C^infinity function Gamma on R^n with Gamma(0) = 0 (grad Gamma(0) is not
    normalized); Gamma, a, b, c are defined on the whole space, which loses nothing after a cutoff;
    (2) a is C^infinity, symmetric and uniformly elliptic (the upper bound is automatic locally),
    and b, c are continuous; (3) u is a classical C^2 solution with u and grad u continuous up to
    the graph, which loses nothing for smooth coefficients; (4) in part (b) the operator is the
    Laplacian and the normal derivative is bounded; (5) the regularity conditions on h in part (b)
    are restated for Lambda(sigma) = log(1/h(e^{-sigma})): superlinear, eventually convex, and
    Lambda(sigma + t) <= e^{Ct} Lambda(sigma), the integrated form of s omega'(s) <= C omega(s);
    h is positive and nondecreasing on (0, rho), and the divergence of the log-integral is stated
    as the limit of the interval integral over (epsilon, rho/2); (6) in part (a) the decay of h is
    stated as h(r) <= exp(-M/r) eventually for every M, which is equivalent to
    r log(1/h(r)) -> infinity for positive h and also allows h with zeros; (7) the Neumann bound is
    imposed on the whole boundary piece, including x = 0.

