      tool_setup: "Claude Code agents and workflows writing Lean, checked with lake build and lake comparator"
      cost:
        wall_time: "in progress"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "The informal proof of Theorem I was supplied to the agents as a blueprint."
  spend_usd: "not tracked"
  notes: "The statement was written and audited with AI agents and is reviewed by the maintainer."

fidelity:
  divergences: >-
    The informal Theorem I allows C^{3,1} boundaries, C^{2,1} leading coefficients, bounded lower
    order coefficients, weak solutions, and in part (b) constant coefficient operators. The formal
    statements assume a smooth boundary graph and smooth a, continuous b and c, classical C^2
    solutions with C^1 boundary values, and in part (b) the Laplacian.

review:
  status: "self-assessed, in progress"
  reviewers:
