# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "Maz'ya's refined Cauchy problem at a boundary point"
  description: >-
    Uniqueness for second order elliptic equations near a boundary point when the Dirichlet data
    vanish to infinite order and only the Neumann (conormal) data are small. Theorem I(a): for
    div(a grad u) + b . grad u + c u = 0 with smooth symmetric uniformly elliptic a and continuous
    b, c, in a smooth domain of any dimension, a bound |a grad u . n| <= h(|x|) with
    h(r) <= exp(-M/r) for small r and every M (r log(1/h(r)) -> infinity) forces u = 0 near the
    point. Theorem I(b): for harmonic u in a smooth
    domain of any dimension, the same holds whenever the integral of log h near 0 diverges, for
    regular h. For h in this regularity class, which has not been compared with the unspecified
    regularity conditions of Maz'ya and Havin, part (b) is, in local form, the sufficiency half of
    the first question of Problem 5.3 in Maz'ya's list of unsolved problems (2018): smooth domains
    in place of the half-space, for the Laplacian. Part (a) does not settle the second question: it
    needs r log(1/h(r)) -> infinity and bounds the conormal derivative.
  authors:
    - "Yongxi (Aaron) Lin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yongxi (Aaron) Lin"

classification:
  arxiv: ["math.AP"]
  msc2020: ["35B60", "35J15", "35R25"]

sources:
  - title: "Strong uniqueness in the Cauchy problem at a boundary point (unpublished note, Theorem I)"
    type: other
    authors:
      - "Yongxi (Aaron) Lin"
    relationship: formalizes
    note: >-
      Unpublished note (2026), written by the maintainer with AI assistance, in which Theorem I and
      its informal proof first appeared; it is not publicly available. The Lean development
      formalizes Theorem I(a) and I(b) in the smooth setting described under fidelity, following
      the note's proof with the departures listed in BLUEPRINT.md. The note preceded this
      formalization; publication priority and novelty are not claimed.
  - title: "Seventy five (thousand) unsolved problems in analysis and partial differential equations"
    authors:
      - "Vladimir Maz'ya"
    type: paper
    id: "doi:10.1007/s00020-018-2460-8"
    location: "Section 5.3 (p. 15 of https://users.mai.liu.se/vlama82/pdf/Problems2018l_0312.pdf)"
    relationship: background
    note: "Integral Equations and Operator Theory 90 (2018), Paper No. 25. Problem 5.3 poses the question addressed by Theorem I."
  - title: "On the solutions of the Cauchy problem for the Laplace equation (uniqueness, normality, approximation)"
    authors:
      - "V. G. Maz'ya"
      - "V. P. Havin"
    type: paper
    id: "https://www.mathnet.ru/eng/mmo300"
    location: "the half-space uniqueness criterion (integral of log h = -infinity)"
    relationship: background
    note: "Trudy Moskov. Mat. Obshch. 30 (1974); English translation Trans. Moscow Math. Soc. 30 (1974), 65-117."

